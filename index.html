<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Runner with Fullscreen</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #fff;
        }
        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2d2d2d;
            padding: 10px 20px;
            border-bottom: 1px solid #444;
        }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }
        button:hover { background: #005999; }
        #workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
        }
        #editor-pane, #preview-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        textarea {
            flex: 1;
            background: #1e1e1e;
            color: #dcdcdc;
            border: none;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            border-right: 1px solid #444;
        }
        iframe {
            flex: 1;
            background: white;
            border: none;
        }
    </style>
</head>
<body>

    <div id="container">
        <header>
            <span>HTML Runner</span>
            <button onclick="toggleFullscreen()">Go Fullscreen</button>
        </header>
        
        <div id="workspace">
            <div id="editor-pane">
                <textarea id="code-input" placeholder="Type your HTML here..." oninput="runCode()">&lt;h1&gt;Hello World&lt;/h1&gt;</textarea>
            </div>
            <div id="preview-pane">
                <iframe id="preview-frame"></iframe>
            </div>
        </div>
    </div>

    <script>
        function runCode() {
            const code = document.getElementById('code-input').value;
            const iframe = document.getElementById('preview-frame');
            iframe.srcdoc = code;
        }

        function toggleFullscreen() {
            const elem = document.getElementById('container');
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Run initial code on load
        runCode();
    </script>
</body>
</html>
